<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>案件 1 · 时间线拼图</title>
<script src="../../game-state.js"></script>
<style>
  :root {
    --bg-deep: #050810;
    --bg-panel: #0c1220;
    --bg-slot: #111827;
    --cyan: #00d4ff;
    --cyan-dim: #007a94;
    --cyan-glow: 0 0 14px rgba(0, 212, 255, 0.7), 0 0 30px rgba(0, 212, 255, 0.3);
    --cyan-glow-strong: 0 0 22px rgba(0, 212, 255, 0.95), 0 0 50px rgba(0, 212, 255, 0.5);
    --text-primary: #d4e4f5;
    --text-dim: #5a7a96;
    --text-hint: #6b8399;
    --border-subtle: rgba(0, 212, 255, 0.15);
    --border-hover: rgba(0, 212, 255, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(0, 100, 140, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0, 60, 90, 0.15) 0%, transparent 65%),
      repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px 20px 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 10px;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 14px;
  }

  .header-title {
    font-size: 18px;
    letter-spacing: 3px;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    font-weight: 400;
  }

  .header-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-top: 3px;
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-label {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .progress-value {
    font-size: 22px;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
    font-family: "Courier New", monospace;
    font-weight: bold;
  }

  .progress-bar-outer {
    width: 140px;
    height: 6px;
    background: #1a2030;
    border: 1px solid var(--border-subtle);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-inner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));
    box-shadow: 0 0 10px var(--cyan);
    transition: width 0.6s ease;
  }

  /* ===== 时间线区域 ===== */
  .timeline-section {
    position: relative;
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 18px 14px 22px;
    margin-bottom: 16px;
    box-shadow: inset 0 0 40px rgba(0, 100, 140, 0.08);
  }

  .timeline-section::before {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(0, 212, 255, 0.06);
    border-radius: 4px;
    pointer-events: none;
  }

  .timeline-title {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 3px;
    margin-bottom: 14px;
    padding-left: 4px;
  }

  .timeline-track {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 8px;
  }

  .timeline-track::before {
    content: "";
    position: absolute;
    top: 52px;
    left: 5%;
    right: 5%;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      var(--cyan-dim) 15%,
      var(--cyan-dim) 85%,
      transparent 100%);
    transition: all 0.8s ease;
  }

  .timeline-track.complete::before {
    background: linear-gradient(90deg,
      var(--cyan) 0%,
      var(--cyan) 50%,
      var(--cyan) 100%);
    box-shadow: 0 0 15px var(--cyan), 0 0 30px rgba(0, 212, 255, 0.5);
  }

  .slot {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 14.5%;
    z-index: 2;
  }

  .slot-time-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-family: "Courier New", monospace;
    transition: color 0.3s;
  }

  .slot.filled .slot-time-label {
    color: var(--cyan);
    text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
  }

  .slot-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--bg-slot);
    border: 2px solid var(--cyan-dim);
    margin-bottom: 10px;
    position: relative;
    transition: all 0.3s;
  }

  .slot.filled .slot-dot {
    background: var(--cyan);
    border-color: var(--cyan);
    box-shadow: 0 0 12px var(--cyan), 0 0 25px rgba(0, 212, 255, 0.6);
  }

  .slot.drop-target .slot-dot {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
  }

  .slot-card-area {
    width: 100%;
    aspect-ratio: 3/4;
    min-height: 100px;
    border: 2px dashed rgba(0, 212, 255, 0.2);
    border-radius: 6px;
    background: rgba(10, 16, 28, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    overflow: hidden;
  }

  .slot.drop-target .slot-card-area {
    border-color: var(--cyan);
    border-style: solid;
    background: rgba(0, 212, 255, 0.08);
    box-shadow: inset 0 0 20px rgba(0, 212, 255, 0.15);
  }

  .slot.filled .slot-card-area {
    border: 2px solid var(--cyan);
    box-shadow: var(--cyan-glow);
    cursor: pointer;
    background: rgba(0, 212, 255, 0.05);
  }

  .slot-card-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .slot-card-area .card-time {
    position: absolute;
    bottom: 3px;
    left: 3px;
    right: 3px;
    text-align: center;
    font-size: 9px;
    color: var(--cyan);
    letter-spacing: 1px;
    background: rgba(0, 10, 20, 0.7);
    padding: 2px;
    border-radius: 2px;
  }

  .slot-number {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--bg-deep);
    border: 1px solid var(--cyan-dim);
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
  }

  .slot.filled .slot-number {
    border-color: var(--cyan);
    color: var(--cyan);
  }

  /* ===== 卡牌池 ===== */
  .pool-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .pool-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 4px;
  }

  .pool-title {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 3px;
  }

  .pool-hint {
    font-size: 11px;
    color: var(--text-hint);
    letter-spacing: 1px;
  }

  .card-pool {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    box-shadow: inset 0 0 30px rgba(0, 100, 140, 0.06);
    min-height: 140px;
  }

  .card {
    position: relative;
    width: 110px;
    height: 146px;
    border: 1.5px solid rgba(0, 212, 255, 0.25);
    border-radius: 5px;
    background: #0a111c;
    overflow: hidden;
    cursor: grab;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }

  .card:hover {
    border-color: var(--cyan-dim);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
  }

  .card:active { cursor: grabbing; }

  .card.dragging {
    opacity: 0.85;
    transform: scale(1.05);
    z-index: 1000;
    box-shadow: 0 0 25px rgba(0, 212, 255, 0.6);
    border-color: var(--cyan);
    pointer-events: none;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .card-time-badge {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0, 5, 12, 0.9));
    padding: 12px 6px 5px;
    text-align: center;
  }

  .card-time-badge span {
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 1.5px;
    font-family: "Courier New", monospace;
    text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
  }

  .card.dragging-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: scale(1.08);
    box-shadow: 0 8px 30px rgba(0, 212, 255, 0.5);
    border-color: var(--cyan);
    opacity: 0.95;
  }

  .card.placed { display: none; }

  /* ===== 物证按钮 ===== */
  .evidence-btn {
    position: fixed;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-panel);
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    padding: 12px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 2px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    z-index: 10;
    transition: all 0.3s;
    box-shadow: 0 0 12px rgba(0, 212, 255, 0.15);
    font-family: inherit;
  }

  .evidence-btn:hover {
    background: rgba(0, 212, 255, 0.08);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.35);
  }

  /* ===== 提示文字 ===== */
  .hint-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-hint);
    font-size: 15px;
    letter-spacing: 3px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 50;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
    background: rgba(0, 5, 12, 0.85);
    padding: 12px 24px;
    border-radius: 4px;
    border: 1px solid var(--border-subtle);
  }

  .hint-text.show { opacity: 1; }

  /* ===== 抖动动画 ===== */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-10px) rotate(-1deg); }
    30% { transform: translateX(8px) rotate(1deg); }
    45% { transform: translateX(-7px) rotate(-0.5deg); }
    60% { transform: translateX(5px) rotate(0.5deg); }
    75% { transform: translateX(-3px); }
    90% { transform: translateX(2px); }
  }

  .shake { animation: shake 0.5s ease-in-out; }

  /* ===== 锁定光效动画 ===== */
  @keyframes lockPulse {
    0% { box-shadow: 0 0 5px var(--cyan); }
    50% { box-shadow: var(--cyan-glow-strong); }
    100% { box-shadow: var(--cyan-glow); }
  }

  .slot.filled .slot-card-area {
    animation: lockPulse 2s ease-in-out infinite;
  }

  /* ===== 时间线完整点亮 ===== */
  .timeline-track.complete .slot.filled .slot-card-area {
    animation: lockPulse 1.5s ease-in-out infinite;
  }

  /* ===== 独白弹窗 ===== */
  .monologue-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 4, 10, 0.85);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }

  .monologue-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .monologue-box {
    width: 85%;
    max-width: 520px;
    background: linear-gradient(180deg, #0c1622 0%, #070d16 100%);
    border: 1px solid var(--cyan-dim);
    border-radius: 8px;
    padding: 28px 32px 24px;
    position: relative;
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.2), inset 0 0 30px rgba(0, 212, 255, 0.05);
  }

  .monologue-box::before,
  .monologue-box::after {
    content: "";
    position: absolute;
    width: 40px;
    height: 40px;
    border: 1px solid var(--cyan);
    opacity: 0.4;
  }

  .monologue-box::before {
    top: -1px; left: -1px;
    border-right: none;
    border-bottom: none;
  }

  .monologue-box::after {
    bottom: -1px; right: -1px;
    border-left: none;
    border-top: none;
  }

  .monologue-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .monologue-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a3040, #0a1520);
    border: 1px solid var(--cyan-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
  }

  .monologue-title {
    font-size: 15px;
    color: var(--cyan);
    letter-spacing: 2px;
  }

  .monologue-subtitle {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .monologue-text {
    font-size: 16px;
    line-height: 2;
    color: var(--text-primary);
    letter-spacing: 0.5px;
    font-style: italic;
    position: relative;
    padding-left: 18px;
  }

  .monologue-text::before {
    content: "";
    position: absolute;
    left: 0;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: linear-gradient(180deg, var(--cyan), transparent);
  }

  .monologue-close-hint {
    position: absolute;
    bottom: 12px;
    right: 16px;
    font-size: 10px;
    color: var(--text-hint);
    letter-spacing: 1px;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  /* ===== 物证弹窗 ===== */
  .evidence-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 4, 10, 0.9);
    backdrop-filter: blur(6px);
    z-index: 120;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s;
  }

  .evidence-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .evidence-modal-title {
    font-size: 18px;
    color: var(--cyan);
    letter-spacing: 4px;
    margin-bottom: 20px;
    text-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
  }

  .evidence-grid {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 800px;
  }

  .evidence-item {
    width: 240px;
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 10px;
    transition: all 0.3s;
  }

  .evidence-item:hover {
    border-color: var(--cyan-dim);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
  }

  .evidence-item img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    border-radius: 4px;
    display: block;
  }

  .evidence-item-label {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-top: 10px;
  }

  .evidence-close {
    margin-top: 24px;
    padding: 10px 36px;
    background: transparent;
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
  }

  .evidence-close:hover {
    background: rgba(0, 212, 255, 0.08);
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
  }

  /* ===== 完成遮罩 ===== */
  .completion-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0, 20, 40, 0.92) 0%, rgba(0, 0, 0, 0.98) 100%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s;
  }

  .completion-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .completion-title {
    font-size: 28px;
    color: var(--cyan);
    letter-spacing: 8px;
    text-shadow: 0 0 20px rgba(0, 212, 255, 0.8), 0 0 50px rgba(0, 212, 255, 0.4);
    margin-bottom: 16px;
    animation: completionPulse 2s ease-in-out infinite;
  }

  @keyframes completionPulse {
    0%, 100% { text-shadow: 0 0 20px rgba(0, 212, 255, 0.8), 0 0 50px rgba(0, 212, 255, 0.4); }
    50% { text-shadow: 0 0 30px rgba(0, 212, 255, 1), 0 0 70px rgba(0, 212, 255, 0.6); }
  }

  .completion-subtitle {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 3px;
    margin-bottom: 30px;
  }

  .completion-stat {
    font-size: 48px;
    color: var(--cyan);
    font-family: "Courier New", monospace;
    font-weight: bold;
    text-shadow: 0 0 25px rgba(0, 212, 255, 0.7);
    margin-bottom: 10px;
  }

  .completion-btn {
    padding: 14px 50px;
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    border-radius: 4px;
    font-size: 14px;
    letter-spacing: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
    margin-top: 10px;
  }

  .completion-btn:hover {
    background: rgba(0, 212, 255, 0.12);
    box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .app { padding: 10px; }
    .header-title { font-size: 15px; letter-spacing: 2px; }
    .header-subtitle { font-size: 10px; }
    .progress-value { font-size: 18px; }
    .progress-bar-outer { width: 80px; }
    .timeline-section { padding: 12px 8px 16px; }
    .timeline-track { padding: 0 4px; }
    .slot { width: 15.5%; }
    .slot-card-area { min-height: 80px; }
    .slot-dot { width: 10px; height: 10px; }
    .slot-number { width: 16px; height: 16px; font-size: 8px; }
    .slot-time-label { font-size: 8px; }
    .card { width: 82px; height: 110px; }
    .card-time-badge span { font-size: 9px; }
    .evidence-btn { right: 8px; font-size: 11px; padding: 10px 8px; }
    .monologue-box { padding: 20px 22px 18px; }
    .monologue-text { font-size: 14px; line-height: 1.9; }
    .completion-title { font-size: 22px; letter-spacing: 5px; }
    .completion-stat { font-size: 36px; }
  }
</style>
</head>
<body>

<!-- 开场衔接说明（序幕 → 时间线拼图） -->
<div id="introOverlay" style="position:fixed;inset:0;background:rgba(5,8,16,0.92);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity 0.6s ease;">
  <div style="max-width:560px;background:linear-gradient(180deg,#0c1220 0%,#070d16 100%);border:1px solid #007a94;padding:36px 42px 32px;box-shadow:0 0 50px rgba(0,100,140,0.3);text-align:center;position:relative;">
    <div style="font-size:11px;letter-spacing:6px;color:#00d4ff;margin-bottom:14px;">前 往 现 场</div>
    <h2 style="font-size:22px;color:#d4e4f5;letter-spacing:4px;font-weight:400;margin-bottom:22px;">时间线重构</h2>
    <p style="font-size:15px;line-height:2;color:#b8c8d8;letter-spacing:1px;margin-bottom:8px;">根据现场勘察，专案组整理出了 <span style="color:#00d4ff;">6 个关键事件</span>。</p>
    <p style="font-size:15px;line-height:2;color:#b8c8d8;letter-spacing:1px;margin-bottom:24px;">现在需要按照时间线，<span style="color:#00d4ff;">梳理事件发生的先后顺序</span>，还原案件经过。</p>

  </div>
</div>

<script>
(() => {
  'use strict';

  // ========== 数据配置 ==========
  const EVENTS = [
    {
      id: 1,
      image: '素材/素材/事件1.webp',
      timeLabel: '16:30',
      title: '藏入衣柜',
      description: '凶手进入酒店，藏入更衣室衣柜',
      monologue: '下午四点半。天还没黑。他从正门进去的？还是从消防通道？不管怎么进去的，他进去之后就没再出来。他在等。'
    },
    {
      id: 2,
      image: '素材/素材/事件2.webp',
      timeLabel: '18:10',
      title: '浏览婚纱照',
      description: '林小姐解锁手机，浏览婚纱照',
      monologue: '六点十分。她还在看婚纱照。她不知道房间里有人，她不知道这是她最后一次看这些照片。'
    },
    {
      id: 3,
      image: '素材/素材/事件3.webp',
      timeLabel: '18:15',
      title: '行凶',
      description: '凶手从衣柜现身，使用羊角锤袭击林小姐',
      monologue: '五分钟后。他从衣柜里出来了，她甚至没来得及回头。'
    },
    {
      id: 4,
      image: '素材/素材/事件4.webp',
      timeLabel: '18:20',
      title: '撬窗逃离',
      description: '凶手撬开窗户锁扣，翻窗逃离现场',
      monologue: '他走的时候是从窗户走的，来的时候不是。他故意选了不同的路，这个人想过每一步。'
    },
    {
      id: 5,
      image: '素材/素材/事件5.webp',
      timeLabel: '当晚',
      title: '报警',
      description: '酒店工作人员发现遗体，拨打报警电话',
      monologue: '她躺在衣柜旁边。他碰都没碰衣柜里那件婚纱。他的目标不是东西。是人。'
    },
    {
      id: 6,
      image: '素材/素材/事件6.webp',
      timeLabel: '案发后',
      title: '发送暗语',
      description: '凶手发送暗语：THE NEST IS EMPTY NOW. YOUR TURN.',
      monologue: '"轮到你了"，他在跟某个人说话。不是自言自语，这件事还没有结束。'
    }
  ];

  // ========== State ==========
  const state = {
    slots: [null, null, null, null, null, null],
    placedCount: 0,
    completed: false,
    drag: null,
  };

  // ========== DOM ==========
  const timelineTrack = document.getElementById('timelineTrack');
  const cardPool = document.getElementById('cardPool');
  const progressValue = document.getElementById('progressValue');
  const progressBar = document.getElementById('progressBar');
  const hintText = document.getElementById('hintText');
  const monologueOverlay = document.getElementById('monologueOverlay');
  const monologueText = document.getElementById('monologueText');
  const evidenceBtn = document.getElementById('evidenceBtn');
  const evidenceOverlay = document.getElementById('evidenceOverlay');
  const evidenceClose = document.getElementById('evidenceClose');
  const completionOverlay = document.getElementById('completionOverlay');
  const nextPhaseBtn = document.getElementById('nextPhaseBtn');

  // ========== 音效（Web Audio API 合成） ==========
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playErrorSound() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.55, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.45);
  }

  function playSuccessSound() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc2.type = 'triangle';
    osc.frequency.setValueAtTime(330, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(440, ctx.currentTime + 0.15);
    osc2.frequency.setValueAtTime(220, ctx.currentTime);
    osc2.frequency.linearRampToValueAtTime(330, ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.5, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.connect(gain); osc2.connect(gain);
    gain.connect(ctx.destination);
    osc.start(); osc2.start();
    osc.stop(ctx.currentTime + 0.55); osc2.stop(ctx.currentTime + 0.55);
  }

  function playAmbientNote() {
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(165, ctx.currentTime + 1.2);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.3);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 2);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 2.2);
  }

  // ========== UI Builders ==========
  function buildSlots() {
    timelineTrack.innerHTML = '';
    for (let i = 0; i < 6; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.index = i;
      slot.innerHTML = `
        <div class="slot-time-label">${['16:30','18:10','18:15','18:20','当晚','案发后'][i]}</div>
        <div class="slot-dot"></div>
        <div class="slot-card-area"></div>
        <div class="slot-number">${i + 1}</div>
      `;
      slot.addEventListener('click', () => onSlotClick(i));
      timelineTrack.appendChild(slot);
    }
  }

  function buildCardPool() {
    cardPool.innerHTML = '';
    const shuffled = shuffle([...EVENTS]);
    shuffled.forEach(ev => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.eventId = ev.id;
      card.innerHTML = `
        <img src="${ev.image}" alt="事件${ev.id}" draggable="false">
        <div class="card-time-badge"><span>${ev.timeLabel}</span></div>
      `;
      attachDragHandlers(card);
      cardPool.appendChild(card);
    });
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function updateProgress() {
    progressValue.textContent = `${state.placedCount} / 6`;
    progressBar.style.width = `${(state.placedCount / 6) * 100}%`;
  }

  // ========== 拖拽系统（支持桌面鼠标 + 移动端长按） ==========
  // 拖拽状态机：空闲 → 长按中 → 拖拽中 → 落位判定中
  function attachDragHandlers(card) {
    let longPressTimer = null;
    let startX = 0, startY = 0;
    let pointerMoved = false;
    let isDragging = false;
    let pointerId = null;
    let isTouch = false;

    const onPointerDown = (e) => {
      if (card.classList.contains('placed')) return;
      // 防止右键、中键干扰
      if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;

      // 安全守卫：若存在未清理的残留拖拽状态，强制清理
      if (state.drag) {
        if (state.drag.ghost) state.drag.ghost.remove();
        state.drag = null;
      }

      isTouch = (e.pointerType === 'touch' || e.pointerType === 'pen');
      const point = getPointerPos(e);
      startX = point.x; startY = point.y;
      pointerMoved = false;
      pointerId = e.pointerId;
      state._activeCard = card;

      if (isTouch) {
        // 移动端：长按 300ms 触发拖拽
        longPressTimer = setTimeout(() => {
          if (!pointerMoved) {
            isDragging = true;
            doStartDrag(point);
            attachGlobalListeners();
          }
        }, 300);
      } else {
        // 桌面端：鼠标按下立即进入拖拽
        isDragging = true;
        doStartDrag(point);
        attachGlobalListeners();
      }
    };

    const onGlobalMove = (e) => {
      // 仅响应当前指针 ID（多点触控忽略其他手指）
      if (isTouch && e.pointerId !== pointerId) return;

      const point = getPointerPos(e);

      if (!isDragging) {
        // 长按检测阶段：若手指移动超过阈值则取消长按（视为滚动）
        const dx = Math.abs(point.x - startX);
        const dy = Math.abs(point.y - startY);
        if (dx > 8 || dy > 8) {
          pointerMoved = true;
          if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
        }
        return;
      }

      // 拖拽中：阻止默认行为防止页面滚动
      e.preventDefault();
      state._lastPoint = point;
      moveGhost(point);
      updateDropTarget(point);
    };

    const onGlobalUp = (e) => {
      // 清理长按计时器
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }

      if (!isDragging) {
        detachGlobalListeners();
        return;
      }

      isDragging = false;
      detachGlobalListeners();

      // 优先使用最后记录的坐标，防止 pointercancel 时坐标无效
      let point;
      try {
        point = getPointerPos(e);
        if (typeof point.x !== 'number' || typeof point.y !== 'number') {
          point = state._lastPoint || { x: 0, y: 0 };
        }
      } catch(err) {
        point = state._lastPoint || { x: 0, y: 0 };
      }
      state._lastPoint = point;

      const target = findDropTarget(point);
      if (target) {
        const slotIndex = parseInt(target.dataset.index);
        tryPlaceCard(card, slotIndex);
      } else {
        returnCardToPool(card);
      }
      cleanupDrag(card);
    };

    const attachGlobalListeners = () => {
      // 使用 passive:false 确保 preventDefault 能阻止移动端滚动
      document.addEventListener('pointermove', onGlobalMove, { passive: false });
      document.addEventListener('pointerup', onGlobalUp);
      document.addEventListener('pointercancel', onGlobalUp);
    };

    const detachGlobalListeners = () => {
      document.removeEventListener('pointermove', onGlobalMove);
      document.removeEventListener('pointerup', onGlobalUp);
      document.removeEventListener('pointercancel', onGlobalUp);
    };

    card.addEventListener('pointerdown', onPointerDown);
  }

  // 获取指针坐标（统一兼容鼠标 / 触摸 / 笔）
  function getPointerPos(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  // 开始拖拽：创建幽灵卡牌并记录偏移
  function doStartDrag(point) {
    ensureAudio();
    const card = state._activeCard;
    if (!card) return;
    card.classList.add('dragging');

    const rect = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    ghost.classList.remove('dragging');
    ghost.classList.add('dragging-ghost');
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    document.body.appendChild(ghost);

    state.drag = {
      card,
      ghost,
      offsetX: point.x - rect.left,
      offsetY: point.y - rect.top,
    };
  }

  // 移动幽灵卡牌跟手
  function moveGhost(point) {
    if (!state.drag) return;
    state.drag.ghost.style.left = (point.x - state.drag.offsetX) + 'px';
    state.drag.ghost.style.top = (point.y - state.drag.offsetY) + 'px';
  }

  // 更新高亮目标插槽
  function updateDropTarget(point) {
    document.querySelectorAll('.slot.drop-target').forEach(s => s.classList.remove('drop-target'));
    const target = findDropTarget(point);
    if (target && !target.classList.contains('filled')) {
      target.classList.add('drop-target');
    }
  }

  // 命中检测：找到指针下方的插槽
  function findDropTarget(point) {
    const el = document.elementFromPoint(point.x, point.y);
    return el ? el.closest('.slot') : null;
  }

  // 清理拖拽状态
  function cleanupDrag(card) {
    document.querySelectorAll('.slot.drop-target').forEach(s => s.classList.remove('drop-target'));
    if (state.drag && state.drag.ghost) {
      state.drag.ghost.remove();
    }
    if (card) card.classList.remove('dragging');
    state.drag = null;
    state._activeCard = null;
  }

  function tryPlaceCard(card, slotIndex) {
    const eventId = parseInt(card.dataset.eventId);
    const expectedId = slotIndex + 1;

    if (state.slots[slotIndex] !== null) {
      returnCardToPool(card);
      return;
    }

    if (eventId === expectedId) {
      // 放置正确
      state.slots[slotIndex] = eventId;
      state.placedCount++;
      updateProgress();
      placeCardInSlot(card, slotIndex);
      const ev = EVENTS[eventId - 1];
      showMonologue(ev);
      playSuccessSound();
      playAmbientNote();

      if (state.placedCount === 6) {
        onTimelineComplete();
      }
    } else {
      // 放置错误
      playErrorSound();
      showHint('时间对不上，再重新推演');
      card.classList.add('shake');
      setTimeout(() => {
        card.classList.remove('shake');
        returnCardToPool(card);
      }, 500);
    }
  }

  function placeCardInSlot(card, slotIndex) {
    const slotEl = timelineTrack.children[slotIndex];
    const area = slotEl.querySelector('.slot-card-area');
    slotEl.classList.add('filled');
    area.innerHTML = '';
    const ev = EVENTS[parseInt(card.dataset.eventId) - 1];
    const img = document.createElement('img');
    img.src = ev.image;
    img.alt = ev.title;
    area.appendChild(img);

    const timeBadge = document.createElement('div');
    timeBadge.className = 'card-time';
    timeBadge.textContent = ev.timeLabel;
    area.appendChild(timeBadge);

    card.classList.add('placed');
    card.style.display = 'none';
  }

  function returnCardToPool(card) {
    card.classList.remove('dragging');
    card.style.display = '';
  }

  // ========== 插槽点击（重新触发独白） ==========
  function onSlotClick(index) {
    if (state.slots[index] === null) return;
    const ev = EVENTS[state.slots[index] - 1];
    showMonologue(ev);
  }

  // ========== 提示文字 ==========
  let hintTimer = null;
  function showHint(text) {
    hintText.textContent = text;
    hintText.classList.add('show');
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hintText.classList.remove('show'), 2000);
  }

  // ========== Monologue ==========
  let monologueTimer = null;
  function showMonologue(ev) {
    monologueText.textContent = ev.monologue;
    monologueOverlay.classList.add('show');
    if (monologueTimer) clearTimeout(monologueTimer);
  }

  monologueOverlay.addEventListener('click', () => {
    monologueOverlay.classList.remove('show');
  });

  // ========== 物证弹窗 ==========
  evidenceBtn.addEventListener('click', () => {
    ensureAudio();
    evidenceOverlay.classList.add('show');
  });

  evidenceClose.addEventListener('click', () => {
    evidenceOverlay.classList.remove('show');
  });

  evidenceOverlay.addEventListener('click', (e) => {
    if (e.target === evidenceOverlay) {
      evidenceOverlay.classList.remove('show');
    }
  });

  // ========== Completion ==========
  function onTimelineComplete() {
    state.completed = true;
    timelineTrack.classList.add('complete');
    // 时间线完成 → 获得完整时间线证据
    if (window.GameState) GameState.addEvidence('timeline');
    setTimeout(() => {
      completionOverlay.classList.add('show');
    }, 1200);
  }

  nextPhaseBtn.addEventListener('click', () => {
    completionOverlay.classList.remove('show');
    // 打开"关键发现"模态框
    showKeyFindings();
  });

  // ========== 关键发现阶段 ==========
  // 法医报告 / 论坛私信 / 匿名警告 / NEMESIS 线索卡
  function showKeyFindings() {
    const overlay = document.getElementById('keyFindingsOverlay');
    const content = document.getElementById('kfContent');
    content.innerHTML = '';

    const findings = [
      {
        tag: '物 证 · 法 医 报 告',
        title: '法医报告 · 死因确认',
        body: '死者头部伤口为多处钝击伤，凶器为带尖端的金属工具——羊角锤一类。伤口形态、力度均显示凶手为成年男性，且有一定体力。',
        note: '"凶器确认了。羊角锤——他在衣柜里等了九十分钟，就为了用这个东西。"'
      },
      {
        tag: '物 证 · 论 坛 私 信',
        title: '林小姐论坛私信 · 暗语',
        body: '【发送人：NEMESIS_07】\nNEST IS READY.\n（巢穴已就绪。）\n——发送时间：案发前 3 天',
        note: '"NEST——巢穴。他在告诉某个人：我准备好了。这件事从一开始就不是一个人做的。"'
      },
      {
        tag: '物 证 · 匿 名 警 告',
        title: '论坛匿名警告',
        body: '【匿名用户】\n删掉。不要回复。立刻。\n——发送时间：暗语发出后 4 分钟',
        note: '"有人在警告他。这个人知道 NEMESIS 是谁，但他不敢发声——他在保护自己。"'
      },
      {
        tag: '线 索 卡 · NEMESIS',
        title: 'NEMESIS · 复仇女神',
        body: '代号来源：古希腊神话中的复仇与因果女神。\n涉案角色：本案凶手，负责"潜伏"与"行凶"。\n特征：周密计划、提前潜伏、灭口式作案。',
        note: '"复仇女神。他把自己当成了替天行道的人。但他选错了对象——新娘是无辜的。"'
      }
    ];

    findings.forEach((f, idx) => {
      const card = document.createElement('div');
      card.style.cssText = 'background:rgba(0,212,255,0.04);border:1px solid rgba(0,212,255,0.2);border-left:3px solid #00d4ff;padding:16px 20px;border-radius:4px;opacity:0;transform:translateY(12px);transition:all 0.6s ease ' + (idx * 0.2) + 's;';
      card.innerHTML = `
        <div style="font-size:10px;letter-spacing:3px;color:#007a94;margin-bottom:6px;">${f.tag}</div>
        <div style="font-size:15px;color:#00d4ff;letter-spacing:2px;margin-bottom:10px;">${f.title}</div>
        <div style="font-size:13px;line-height:1.9;color:#d4e4f5;background:rgba(0,0,0,0.3);padding:12px 14px;border-radius:3px;font-family:'Courier New',monospace;white-space:pre-wrap;margin-bottom:10px;">${f.body}</div>
        <div style="font-size:13px;line-height:1.85;color:#8aa0b8;font-style:italic;padding-left:14px;border-left:2px solid #007a94;">— 林深笔记：${f.note}</div>
      `;
      content.appendChild(card);
      // 触发渐入动画
      setTimeout(() => {
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, 50);
    });

    // 关键发现 → 获得证据
    if (window.GameState) {
      GameState.addEvidences(['forensic', 'forum-msg', 'anonymous-warn', 'nemesis-card']);
      GameState.setScore('level1', 1);
    }

    overlay.style.display = 'flex';
    setTimeout(() => overlay.classList.add('show'), 30);
  }

  document.getElementById('kfNextBtn').addEventListener('click', () => {
    const overlay = document.getElementById('keyFindingsOverlay');
    overlay.classList.remove('show');
    setTimeout(() => { overlay.style.display = 'none'; }, 600);
    // 进入下一章节（剧情 2 · 中段转折）
    if (window.GameState) {
      GameState.next();
    }
  });

  // ========== 3D 模型预留接口（未来集成） ==========
  function loadHammer3DModel() {
    // 预留 3D 模型集成接口
    // 模型路径：素材/素材/羊角锤/Hammer.obj
    // 预览图：素材/素材/羊角锤/hammer.webp
    return {
      modelPath: '素材/素材/羊角锤/Hammer.obj',
      previewPath: '素材/素材/羊角锤/hammer.webp',
      loaded: false,
      load: function() {
        console.log('[3D 预留] 加载 Hammer.obj 模型...');
        this.loaded = true;
        return this;
      }
    };
  }
  window.__loadHammer3DModel = loadHammer3DModel;

  // ========== 初始化 ==========
  function init() {
    buildSlots();
    buildCardPool();
    updateProgress();

    // 开场衔接说明的"开始推演"按钮
    const introOverlay = document.getElementById('introOverlay');
    const introBtn = document.getElementById('introStartBtn');
    if (introBtn && introOverlay) {
      introBtn.addEventListener('click', () => {
        introOverlay.style.opacity = '0';
        setTimeout(() => { introOverlay.style.display = 'none'; }, 600);
      });
      introBtn.addEventListener('mouseenter', () => {
        introBtn.style.background = '#00d4ff';
        introBtn.style.color = '#050810';
      });
      introBtn.addEventListener('mouseleave', () => {
        introBtn.style.background = 'transparent';
        introBtn.style.color = '#00d4ff';
      });
    }

    // === GameState 集成 ===
    if (window.GameState) {
      GameState.setCurrentScene('level1');
      GameState.injectEvidencePanel({ theme: 'dark' });
      // 现场勘查阶段已获得的物证（阶段 A）
      GameState.addEvidences(['hammer-fragment', 'pry-mark', 'closet-scratch']);
    }
  }

  // 等待 DOM 与图片就绪
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 阻止图片默认拖拽
  document.addEventListener('dragstart', (e) => e.preventDefault());

})();
</script>
</body>
</html>
